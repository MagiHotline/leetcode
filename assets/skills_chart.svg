  <text x="28" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">Overall Mastery: <tspan fill="#58a6ff" font-weight="700">62.5%</tspan> • Scale 0–100</text>

